<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trends Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Newsreader",Georgia,"Times New Roman",serif;
 --bg:#fff;--ink:#14161b;--mute:#586070;--rule:#e2e5ea;--soft:#f4f5f8;--up:#0b7a53;--down:#b4381f;--new:#6a3dd1;--sat:55%;--lum:31%;--bar:42%}
@media(prefers-color-scheme:dark){:root{--bg:#13151a;--ink:#eceef3;--mute:#a1a7b6;--rule:#2a2e38;--soft:#1c1f27;--up:#4fd09a;--down:#ff8f77;--new:#b9a0ff;--sat:70%;--lum:72%;--bar:66%}}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);-webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:50}.skip:focus{left:8px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--new);outline-offset:2px;border-radius:4px}
.seg{color:hsl(var(--h) var(--sat) var(--lum))}
.sw{display:inline-block;width:.62em;height:.62em;border-radius:2px;background:hsl(var(--h) var(--sat) var(--bar));margin-right:7px;flex:none}

/* masthead */
.mast{padding:22px 0 16px}
.mast-in{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 28px;flex-wrap:wrap}
h1{font:800 clamp(1.7rem,4.2vw,2.3rem)/1 var(--ui);letter-spacing:-.035em;margin:0}
h1 a{text-decoration:none}
#updated{margin:7px 0 0;color:var(--mute);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-size:.92rem;font-weight:500;border:1px solid var(--rule);background:var(--bg);padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px}.group .btn{border:0;padding:5px 13px;min-height:30px}
input[type=search]{font:inherit;font-size:.92rem;border:1px solid var(--rule);border-radius:999px;padding:7px 15px;background:var(--bg);color:var(--ink);width:210px;min-height:36px}
.edition{color:var(--mute);font-size:.92rem}

/* section tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;padding:12px 13px;font-weight:600;font-size:.93rem;color:var(--mute);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}

/* headings */
h2{font:700 1.35rem/1.2 var(--ui);letter-spacing:-.02em;margin:0 0 4px}
.sub{margin:0 0 14px;color:var(--mute);font-size:.94rem}
.block{padding:34px 0 6px}

/* leads */
.leads{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:0 44px;padding:34px 0 36px;border-bottom:1px solid var(--rule)}
.lab{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:.9rem;font-weight:600}
.life{font-weight:700}.life.up{color:var(--up)}.life.down{color:var(--down)}.life.new{color:var(--new)}.life.flat{color:var(--mute)}
.lead1 h3{font:800 clamp(2rem,4.8vw,3.4rem)/1.02 var(--ui);letter-spacing:-.035em;margin:12px 0 16px;text-wrap:balance}
.tbtn{all:unset;cursor:pointer;display:inline}
.tbtn:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.tbtn:focus-visible{outline:3px solid var(--new);outline-offset:3px;border-radius:3px}
.prose{font:400 1.2rem/1.5 var(--serif);margin:0 0 12px;max-width:62ch}
.angle{font:400 1.08rem/1.5 var(--serif);margin:0 0 14px;padding-left:14px;border-left:3px solid hsl(var(--h) var(--sat) var(--bar));max-width:62ch}
.angle b{font-family:var(--ui);font-size:.82rem;font-weight:700;display:block;margin-bottom:2px;color:var(--mute)}
.bigbars{margin:18px 0 6px}.bars{display:block;width:100%;height:auto;fill:hsl(var(--h) var(--sat) var(--bar))}
.barkey{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin-bottom:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--mute)}.facts b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:.8rem;font-weight:600;padding:2px 9px;border:1px solid var(--rule);border-radius:5px;color:var(--mute);background:var(--bg)}
.chip.us{color:var(--new);border-color:currentColor}
.side{display:flex;flex-direction:column}
.lead{padding:0 0 22px}.lead+.lead{border-top:1px solid var(--rule);padding-top:22px}
.lead h3{font:700 1.5rem/1.15 var(--ui);letter-spacing:-.025em;margin:8px 0 8px;text-wrap:balance}
.lead .prose{font-size:1.02rem;margin-bottom:8px}
.lead .bars{max-width:240px;margin:10px 0 4px}

/* rows */
.rows{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 88px 70px;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:14px 8px;cursor:pointer}
.row:hover{background:var(--soft)}
.row:focus-visible{outline-offset:-3px}
.rtitle{display:block;font-weight:600;font-size:1.05rem;line-height:1.3}
.rmeta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.84rem;color:var(--mute);margin-top:4px}
.spark{display:block;color:hsl(var(--h) var(--sat) var(--bar))}
.rnum{text-align:right;font-weight:800;font-size:1.25rem;line-height:1;letter-spacing:-.02em}
.rnum small{display:block;font-weight:400;font-size:.72rem;color:var(--mute);margin-top:4px;letter-spacing:0}

/* themes */
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.theme{display:inline-flex;gap:8px;align-items:baseline;padding:8px 14px;border:1px solid var(--rule);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:600;font-size:.94rem}
.theme small{color:var(--mute);font-weight:500}
.theme:hover{border-color:var(--ink)}
.theme[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.theme[aria-pressed=true] small{color:inherit;opacity:.8}
.filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;margin-top:22px;background:var(--soft);border-radius:8px;font-size:.95rem}

/* sections */
.secblock{padding:34px 0 8px}
.sech{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:8px}
.sech h3,.sech h2{margin:0;font:800 1.6rem/1.1 var(--ui);letter-spacing:-.03em}
.sech a{text-decoration:none}.sech a:hover{text-decoration:underline}
.chg{font-size:.9rem;font-weight:600}.chg.up{color:var(--up)}.chg.down{color:var(--down)}.chg.flat{color:var(--mute)}
.more{display:inline-block;margin:10px 0 0;font-weight:600;font-size:.94rem}
.chan{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 8px}
.chan h3{margin:0;font:700 1.1rem/1.2 var(--ui)}
.jump{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 4px}.jump .btn{font-size:.84rem;padding:3px 11px;min-height:30px}.jump .meta{color:var(--mute);font-size:.88rem;margin-right:4px}.chan{scroll-margin-top:64px}.back{display:inline-block;margin:26px 0 8px;font-weight:600;font-size:.94rem}
.secchart{max-width:640px;margin:14px 0 4px}
.empty{padding:48px 0;max-width:56ch}.empty h2{margin-bottom:8px}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(10,12,18,.5);z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:21;overflow-y:auto;overscroll-behavior:contain;box-shadow:-14px 0 44px rgba(0,0,0,.2);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(28px);opacity:0}}
.dtop{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px;background:var(--bg);border-bottom:1px solid var(--rule)}
.dbody{padding:22px 22px 48px}
#dt{font:800 clamp(1.7rem,5vw,2.3rem)/1.05 var(--ui);letter-spacing:-.03em;margin:10px 0 14px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 4px}
.stats div{padding:10px 0;border-top:2px solid var(--ink)}
.stats b{display:block;font-size:1.6rem;line-height:1.1;letter-spacing:-.03em}.stats span{font-size:.82rem;color:var(--mute)}
.dh{font:700 1rem/1.2 var(--ui);margin:26px 0 8px}
.slist{list-style:none;margin:0;padding:0}.slist li{padding:9px 0;border-top:1px solid var(--rule);font-size:.95rem;line-height:1.35}
.slist a{font-weight:600}.slist small{display:block;color:var(--mute);font-size:.82rem;margin-top:2px}
.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.angle+.angle{margin-top:-4px}.note{font-size:.84rem;color:var(--mute);margin:10px 0 0}

/* picker */
.pick{padding:34px 0 60px;max-width:860px}
.pick h2{font:800 clamp(1.8rem,4.5vw,2.6rem)/1.05 var(--ui);letter-spacing:-.035em;margin:0 0 8px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.plist{border-top:1px solid var(--rule)}
.plist details{border-bottom:1px solid var(--rule);padding:11px 4px}
.plist summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-size:1.02rem}
.plist summary label{font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer}
.plist small{color:var(--mute)}
.psub{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;padding:12px 0 6px 30px}
.psub label{display:flex;gap:9px;align-items:center;cursor:pointer;font-size:.94rem}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink);margin:0}
.pgo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.pgo .btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700;padding:10px 22px}

footer{margin-top:50px;padding:26px 0 60px;border-top:1px solid var(--rule);color:var(--mute);font-size:.88rem}
footer p{max-width:70ch;margin:0 0 8px}

@media(max-width:860px){.leads{grid-template-columns:1fr;padding-top:26px}.side{margin-top:26px;border-top:1px solid var(--rule);padding-top:22px}.lead .bars{max-width:100%}}
@media(max-width:640px){.wrap{padding:0 16px}.edition{display:none}.mast{padding:16px 0 12px}.tools{gap:8px}.tools .btn{padding:5px 11px;min-height:34px;font-size:.88rem}.group .btn{padding:4px 9px;min-height:28px}#updated{margin-top:4px}h1{font-size:1.6rem}.row{grid-template-columns:minmax(0,1fr) 56px}.row .spark{display:none}input[type=search]{width:100%}.tools{width:100%}.stats b{font-size:1.35rem}.dtop,.dbody{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){#drawer{animation:none}}
@media print{.tools,.tabs,#scrim,#drawer,.skip,.more,.back{display:none!important}.leads{break-inside:avoid}.row{break-inside:avoid}body{font-size:12pt}}
</style></head><body>
<a class="skip" href="#main">Skip to trends</a>
<header class="mast"><div class="wrap mast-in">
  <div><h1><a href="#" id="home">Trends Hub</a></h1><p id="updated">Loading latest trends…</p></div>
  <div class="tools" id="tools"></div>
</div></header>
<nav class="tabs" id="tabs" aria-label="Sections"><div class="wrap" id="tabrow"></div></nav>
<main class="wrap" id="main" tabindex="-1"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" hidden></aside>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=c=>(c>0?"+":"")+c+"%",cls=c=>c>10?"up":c<-10?"down":"flat";
const fd=s=>new Date(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
let data,sel=null,chosen=false,view={segments:[],topics:[],early:[]};
let region="uk",topic="",q="";try{region=localStorage.getItem("th_reg")||"uk"}catch{}
const KEY="th_sel",k=(s,c)=>s+"|"+c,has=(s,c)=>!sel||sel.has(k(s,c));
const HUE={},REG=[];
const hue=n=>HUE[n]??0,tid=t=>{if(t._id==null){t._id=REG.length;REG.push(t)}return t._id};
const sg=(c,p)=>{const r=(c+1)/(p+1);return r>=1.5?"rising":r<=.67?"fading":"steady"};
const rs=t=>{if(region==="uk")return t.uk;if(region==="us")return t.us;const a=t.uk,b=t.us,c=a.recent+b.recent,p=a.previous+b.previous;return{recent:c,previous:p,sources:t.sources,daily:a.daily.map((x,i)=>x+b.daily[i]),signal:sg(c,p)}};
const live=t=>{const r=rs(t);return r.recent+r.previous>0};
const life=r=>r.previous===0&&r.recent>0?{t:"New this week",c:"new",i:"✦"}:r.signal==="rising"?{t:"Rising",c:"up",i:"▲"}:r.signal==="fading"?{t:"Cooling",c:"down",i:"▼"}:{t:"Steady",c:"flat",i:"●"};
function guide(t,r){const k=kinds(t),pl=k.filter(x=>x==="wikipedia"||x==="youtube"||x==="google").map(x=>({wikipedia:"Wikipedia",youtube:"YouTube",google:"Google searches"}[x]));
  const via=pl.length?` It is also showing up on ${pl.join(" and ")}, so readers are looking for it directly.`:"";
  if(r.previous===0&&r.recent>0)return`First appearance this week, so there is no history to compare. Keep it on the watch list and check again in a few days before committing space.`+via;
  if(t.origin==="us"&&r.signal!=="fading")return`Moving in the US before the UK. Commissioning now puts you ahead of UK titles that wait for it to arrive.`+via;
  if(r.signal==="rising")return`Interest is up from ${r.previous} to ${r.recent} mentions week on week. It suits a planned feature or a series, and a quick online piece while the interest lasts.`+via;
  if(r.signal==="fading")return`Interest has dropped from ${r.previous} to ${r.recent} mentions. Cover it only with a fresh angle, or use it as supporting content.`;
  return`Steady interest at about ${r.recent} mentions a week. It works as dependable evergreen content rather than a timely hook.`+via}
const ORIGIN={us:"Emerging in the US",uk:"UK only",both:"UK and US"};
const PLAT={wikipedia:"On Wikipedia",youtube:"On YouTube",google:"Trending on Google",mastodon:"On Mastodon"};
const kinds=t=>[...new Set([...(t.platforms||[]),...(t.signals||[]).map(s=>s.kind)])];
const pass=(t,noTopic)=>(noTopic||!topic||(t.topics||[]).includes(topic))&&(!q.trim()||(t.title+" "+(t.summary||"")+" "+(t.angle||"")+" "+t.segment+" "+t.channel).toLowerCase().includes(q.trim().toLowerCase()));
const mkt=(ts,noTopic)=>ts.filter(t=>live(t)&&pass(t,noTopic)).sort((a,b)=>rs(b).recent-rs(a).recent||b.score-a.score);
const PRESETS=[["Women's and lifestyle",["Womens Interest","Home Improvement","Countryside & County"]],["Men's interest",["Mens Fashion / Interest","Motoring & Motorcycling","Sport"]],["Entertainment and culture",["Music","TV Listings","General","Leisure Interests"]],["Tech and gaming",["Computing"]],["Children and teens",["Children's Magazines","Teenage Magazines"]],["Hobbies and collecting",["Puzzle Magazines","Partworks","Specials","Leisure Interests"]],["News and business",["News & Current Affairs","Newspapers","Trade & Professional","Buying & Selling"]]];

/* charts */
function bars(v,w=560,h=96){const m=Math.max(...v,1),n=v.length,gap=Math.max(2,w/n*.18),bw=(w-gap*(n-1))/n;
  return `<svg class="bars" viewBox="0 0 ${w} ${h}" role="img" aria-label="Mentions per day over the last ${n} days, ${sum(v.slice(n-7))} in the last 7 days and ${sum(v.slice(0,n-7))} in the 7 before">`+v.map((a,i)=>{const bh=Math.max(a/m*(h-2),a>0?3:1);return `<rect x="${(i*(bw+gap)).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" opacity="${i>=n-7?1:.38}"/>`}).join("")+`</svg>`}
function spark(v,w=84,h=24){const m=Math.max(...v,1),n=v.length,x=i=>i*w/(n-1),y=a=>h-2-a/m*(h-4);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${v.map((a,i)=>`${x(i).toFixed(1)},${y(a).toFixed(1)}`).join(" ")}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
const barkey=()=>`<div class="barkey"><span>${fd(data.days[0])}</span><span>Solid bars are the last 7 days</span><span>${fd(data.days[data.days.length-1])}, today so far</span></div>`;

/* data */
function agg(ts){const d=data.days.map((_,i)=>sum(ts.map(t=>rs(t).daily[i]||0))),a=sum(d.slice(7)),b=sum(d.slice(0,7));return{daily:d,change:Math.round(100*(a-b)/Math.max(b,1))}}
function derive(){const segs=[],early=[];
  data.segments.forEach(s=>{const chs=s.channels.filter(c=>has(s.name,c.name));chs.forEach(c=>mkt(c.trends).forEach(t=>t.origin==="us"&&early.push(t)));
    const cc=chs.map(c=>{const tr=mkt(c.trends);return{...c,trends:tr,...agg(tr)}}).filter(c=>c.trends.length);if(cc.length)segs.push({...s,channels:cc,...agg(cc.flatMap(c=>c.trends))})});
  const tops=(data.topics||[]).map(t=>{const tr=mkt(t.trends.filter(x=>has(x.segment,x.channel)),true);return{name:t.name,trends:tr,total:tr.length}}).filter(t=>t.total).sort((a,b)=>b.total-a.total);
  view={segments:segs,topics:tops,early:early.sort((a,b)=>b.us.recent-a.us.recent).slice(0,4)}}
const flat=()=>view.segments.flatMap(s=>s.channels.flatMap(c=>c.trends));
function pickLeads(){const all=flat().filter(t=>rs(t).signal!=="fading"),key=t=>region==="us"?rs(t).recent*(1+.3*t.sources):t.score;
  all.sort((a,b)=>key(b)-key(a));const out=[],used=new Set();
  for(const t of all){if(out.length<3&&!used.has(t.segment)){out.push(t);used.add(t.segment)}}
  for(const t of all){if(out.length<3&&!out.includes(t))out.push(t)}return out}
const route=()=>{const m=location.hash.match(/^#s\/(.+)$/);return{s:m?decodeURIComponent(m[1]):""}};
const scope=()=>{if(!sel)return"Everything";const n=data.segments.filter(s=>s.channels.some(c=>sel.has(k(s.name,c.name)))).map(s=>s.name);return n.slice(0,3).join(", ")+(n.length>3?` and ${n.length-3} more`:"")};
const save=v=>{try{localStorage.setItem(KEY,v)}catch{}};
function ser(){if(!sel)return"*";const o=[];data.segments.forEach(s=>{const ks=s.channels.map(c=>k(s.name,c.name)),on=ks.filter(x=>sel.has(x));on.length&&on.length===ks.length?o.push(s.name):o.push(...on)});return o.join("~")}
function loadSel(){let raw=new URLSearchParams(location.search).get("sel");if(raw===null){try{raw=localStorage.getItem(KEY)}catch{}}
  if(!raw)return false;if(raw==="*"){sel=null;return true}sel=new Set();
  raw.split("~").forEach(t=>t.includes("|")?sel.add(t):data.segments.filter(s=>s.name===t).forEach(s=>s.channels.forEach(c=>sel.add(k(s.name,c.name)))));return sel.size>0}

/* pieces */
const chipsFor=t=>kinds(t).map(x=>`<span class="chip">${PLAT[x]||esc(x)}</span>`).join("")+(t.origin==="us"?`<span class="chip us">Emerging in the US</span>`:"");
function row(t,o={}){const r=o.r||rs(t),l=life(r);
  return `<li><button class="row" data-t="${tid(t)}" data-us="${o.r?1:0}" style="--h:${hue(t.segment)}"><span><span class="rtitle">${esc(t.title)}</span><span class="rmeta"><span class="life ${l.c}">${l.i} ${l.t}</span>${o.where?`<span class="seg">${esc(t.segment)}, ${esc(t.channel)}</span>`:""}${t.origin!=="uk"&&!o.r?`<span>${ORIGIN[t.origin]}</span>`:""}${kinds(t).slice(0,2).map(x=>`<span>${PLAT[x]||esc(x)}</span>`).join("")}</span></span>${spark(r.daily)}<span class="rnum">${r.recent}<small>this week</small></span></button></li>`}
const rows=(ts,o)=>`<ul class="rows">${ts.map(t=>row(t,o)).join("")}</ul>`;
function leadBig(t){const r=rs(t),l=life(r);
  return `<article class="lead1" style="--h:${hue(t.segment)}"><div class="lab"><span class="seg"><i class="sw"></i>${esc(t.segment)}, ${esc(t.channel)}</span><span class="life ${l.c}">${l.i} ${l.t}</span></div>
  <h3><button class="tbtn" data-t="${tid(t)}">${esc(t.title)}</button></h3>
  ${t.summary?`<p class="prose">${esc(t.summary)}</p>`:`<p class="prose">${r.recent} mentions this week across ${t.sources} sources, against ${r.previous} the week before.</p>`}
  ${t.angle?`<div class="angle"><b>Angle for editors</b>${esc(t.angle)}</div>`:`<div class="angle"><b>What this means for editors</b>${esc(guide(t,r))}</div>`}
  <div class="bigbars">${bars(r.daily)}</div>${barkey()}
  <div class="facts"><span><b>${r.recent}</b> mentions this week</span><span>${r.previous} the week before</span><span>${t.sources} sources</span></div><div class="chips">${chipsFor(t)}</div></article>`}
function leadSmall(t){const r=rs(t),l=life(r);
  return `<article class="lead" style="--h:${hue(t.segment)}"><div class="lab"><span class="seg"><i class="sw"></i>${esc(t.segment)}</span><span class="life ${l.c}">${l.i} ${l.t}</span></div>
  <h3><button class="tbtn" data-t="${tid(t)}">${esc(t.title)}</button></h3>${t.summary?`<p class="prose">${esc(t.summary)}</p>`:""}
  <div class="bigbars">${bars(r.daily,240,48)}</div><div class="facts"><span><b>${r.recent}</b> this week, ${r.previous} before</span></div></article>`}

/* pages */
function front(){const leads=pickLeads(),M=[];
  if(!view.segments.length)return empty();
  if(topic)M.push(`<div class="filterbar"><span>Showing trends about <b>${esc(topic)}</b></span><button class="btn" data-act="cleartopic">Show all trends</button></div>`);
  if(leads.length)M.push(`<section class="leads" aria-label="Leading this week"><div>${leadBig(leads[0])}</div><div class="side">${leads.slice(1).map(leadSmall).join("")}</div></section>`);
  if(view.topics.length)M.push(`<section class="block"><h2>Themes across your sections</h2><p class="sub">Choose one to see only the trends that share it.</p><div class="themes">${view.topics.map(t=>`<button class="theme" data-topic="${esc(t.name)}" aria-pressed="${topic===t.name}">${esc(t.name)}<small>${t.total}</small></button>`).join("")}</div></section>`);
  if(region!=="us"&&view.early.length)M.push(`<section class="block"><h2>Emerging in the US, not yet in the UK</h2><p class="sub">Early signals worth watching before they reach UK readers.</p>${rows(view.early,{r:null,where:true,us:true}).replace(/data-us="0"/g,'data-us="1"')}</section>`);
  M.push(`<section class="block" aria-label="Sections"><h2>Your sections</h2><p class="sub">The strongest trends in each, ranked by activity this week.</p></section>`);
  view.segments.forEach(s=>{const all=s.channels.flatMap(c=>c.trends).sort((a,b)=>rs(b).recent-rs(a).recent),n=all.length;
    M.push(`<section class="secblock" style="--h:${hue(s.name)}" aria-label="${esc(s.name)}"><div class="sech"><h3><a class="seg" href="#s/${encodeURIComponent(s.name)}">${esc(s.name)}</a></h3><span class="chg ${cls(s.change)}">${fmt(s.change)} on last week</span></div>${rows(all.slice(0,3),{where:true})}${n>3?`<a class="more seg" href="#s/${encodeURIComponent(s.name)}">See all ${n} trends in ${esc(s.name)}</a>`:""}</section>`)});
  return M.join("")}
function section(name){const s=view.segments.find(x=>x.name===name);if(!s)return null;
  return `<a class="back" href="#">Back to front page</a><section style="--h:${hue(s.name)}"><div class="sech"><h2 class="seg">${esc(s.name)}</h2><span class="chg ${cls(s.change)}">${fmt(s.change)} on last week</span></div>
  <div class="secchart">${bars(s.daily,560,80)}${barkey()}</div>
  ${topic?`<div class="filterbar"><span>Showing trends about <b>${esc(topic)}</b></span><button class="btn" data-act="cleartopic">Show all trends</button></div>`:""}
  ${s.channels.length>5?`<nav class="jump" aria-label="Jump to a sub-category"><span class="meta">Jump to</span>${s.channels.map((c,i)=>`<button class="btn" data-jump="c${i}">${esc(c.name)}</button>`).join("")}</nav>`:""}
  ${s.channels.map((c,i)=>`<div class="chan" id="c${i}"><h3>${esc(c.name)}</h3><span class="chg ${cls(c.change)}">${fmt(c.change)} on last week</span></div>${rows(c.trends)}`).join("")}</section>`}
function results(){const all=flat().sort((a,b)=>rs(b).recent-rs(a).recent);
  return `<div class="block"><h2>${all.length?`${all.length} trend${all.length>1?"s":""} matching “${esc(q.trim())}”`:"Nothing matches"}</h2>${all.length?rows(all,{where:true}):`<p class="sub">Try a shorter word, or clear the search. Results only cover the sections you chose and the region shown above.</p>`}</div>`}
function empty(){return `<div class="empty"><h2>No trends to show</h2><p class="sub">${q.trim()||topic?"Your search or theme filter has no matches in these sections.":"There is no activity yet for the sections and region you chose."}</p><div class="tagrow">${q.trim()?`<button class="btn" data-act="clearq">Clear search</button>`:""}${topic?`<button class="btn" data-act="cleartopic">Show all trends</button>`:""}<a class="btn" href="#pick">Change sections</a></div></div>`}
function renderMain(){const M=$("main");M.onclick=null;M.onchange=null;let h;
  if(q.trim())h=view.segments.length?results():empty();
  else if(route().s){h=section(route().s);if(!h){h=front()}}
  else h=front();
  M.innerHTML=h}
function renderTabs(){const r=route().s,t=(href,label,on,name)=>`<a class="tab" href="${href}" ${on?'aria-current="page"':""} ${name?`style="--h:${hue(name)}"`:""}>${name?`<i class="sw" style="--h:${hue(name)}"></i>`:""}${esc(label)}</a>`;
  $("tabrow").innerHTML=t("#","Front page",!r)+view.segments.map(s=>t("#s/"+encodeURIComponent(s.name),s.name,r===s.name,s.name)).join("");
  $("tabs").hidden=false;const on=$("tabrow").querySelector("[aria-current=page]");if(on){const r=$("tabrow");r.scrollLeft=Math.max(0,on.offsetLeft-r.clientWidth/2+on.offsetWidth/2)}}
function renderTools(){
  $("tools").innerHTML=`<span class="edition">${esc(scope())}</span><a class="btn" href="#pick">Change sections</a>
  <span class="group" role="group" aria-label="Region">${[["uk","UK"],["us","US"],["both","UK and US"]].map(([v,l])=>`<button class="btn" data-r="${v}" aria-pressed="${region===v}">${l}</button>`).join("")}</span>
  <input type="search" id="q" placeholder="Search trends" aria-label="Search trends" value="${esc(q)}">`;
  $("q").oninput=e=>{q=e.target.value;derive();renderTabs();renderMain()}}
function refresh(){derive();renderTools();renderTabs();renderMain()}
function show(){closeDrawer(true);const pick=!chosen||location.hash==="#pick";
  if(pick){picker();return}
  refresh();window.scrollTo(0,0)}

/* picker */
function picker(){$("tools").innerHTML="";$("tabs").hidden=true;
  const all=data.segments.flatMap(s=>s.channels.map(c=>k(s.name,c.name)));const draft=new Set(chosen?(sel||all):[]);
  $("main").innerHTML=`<div class="pick"><h2>What do you cover?</h2><p class="sub">Choose the sections that matter to you and the hub will only show those. You can change this at any time.</p>
  <div class="presets" role="group" aria-label="Quick picks">${PRESETS.map((p,i)=>`<button class="btn" data-p="${i}">${esc(p[0])}</button>`).join("")}</div>
  <div class="plist">${data.segments.filter(s=>s.channels.length).map(s=>`<details><summary><label><input type="checkbox" data-s="${esc(s.name)}"><span class="seg" style="--h:${hue(s.name)}">${esc(s.name)}</span></label><small>${s.channels.length} sub-categor${s.channels.length===1?'y':'ies'}</small></summary><div class="psub">${s.channels.map(c=>`<label><input type="checkbox" data-k="${esc(k(s.name,c.name))}">${esc(c.name)}</label>`).join("")}</div></details>`).join("")}</div>
  <div class="pgo"><button class="btn main" id="go">Show my trends</button><button class="btn" id="every">Show everything</button><span class="sub" id="warn" role="status" style="margin:0"></span></div></div>`;
  const M=$("main"),ks=()=>[...M.querySelectorAll("[data-k]")];
  const sync=()=>{ks().forEach(i=>i.checked=draft.has(i.dataset.k));M.querySelectorAll("[data-s]").forEach(i=>{const g=ks().filter(x=>x.dataset.k.startsWith(i.dataset.s+"|")),n=g.filter(x=>draft.has(x.dataset.k)).length;i.checked=n===g.length;i.indeterminate=n>0&&n<g.length})};
  M.onchange=e=>{const t=e.target;if(t.dataset.k)t.checked?draft.add(t.dataset.k):draft.delete(t.dataset.k);if(t.dataset.s)ks().filter(x=>x.dataset.k.startsWith(t.dataset.s+"|")).forEach(x=>t.checked?draft.add(x.dataset.k):draft.delete(x.dataset.k));sync()};
  M.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.p!==undefined){draft.clear();ks().forEach(x=>PRESETS[b.dataset.p][1].includes(x.dataset.k.split("|")[0])&&draft.add(x.dataset.k));sync()}
    if(b.id==="every"){sel=null;chosen=true;save("*");done()}
    if(b.id==="go"){if(!draft.size){$("warn").textContent="Tick at least one section first.";return}sel=new Set(draft);chosen=true;save(ser());done()}};
  sync();window.scrollTo(0,0)}
function done(){history.replaceState(null,"",location.pathname+location.search);show()}

/* detail drawer */
let lastFocus=null,openT_=null;
function openT(id,trigger,us){const t=REG[id];if(!t)return;openT_=t;lastFocus=trigger||document.activeElement;
  const r=us?t.us:rs(t),l=life(r),d=$("drawer");
  const plat=t.items.filter(i=>i.source==="Wikipedia"||i.source==="YouTube"),news=t.items.filter(i=>!plat.includes(i)),grp=(name,ls)=>ls.length?`<h3 class="dh">${name}</h3><ul class="slist">${ls.map(i=>`<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a><small>${esc(i.source)}, ${new Date(i.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</small></li>`).join("")}</ul>`:"";
  d.style.setProperty("--h",hue(t.segment));
  d.innerHTML=`<div class="dtop"><span class="seg"><i class="sw"></i>${esc(t.segment)}, ${esc(t.channel)}</span><button class="btn" data-act="close" id="dclose">Close</button></div>
  <div class="dbody"><div class="lab"><span class="life ${l.c}">${l.i} ${l.t}</span><span>${ORIGIN[t.origin]}</span></div>
  <h2 id="dt">${esc(t.title)}</h2>
  ${t.summary?`<p class="prose">${esc(t.summary)}</p>`:""}${t.angle?`<div class="angle"><b>Angle for editors</b>${esc(t.angle)}</div>`:""}<div class="angle"><b>What this means for editors</b>${esc(guide(t,r))}</div>
  <div class="stats"><div><b>${r.recent}</b><span>mentions this week</span></div><div><b>${r.previous}</b><span>the week before</span></div><div><b>${t.sources}</b><span>sources</span></div></div>
  <div class="bigbars">${bars(r.daily,560,120)}</div>${barkey()}
  <p class="note">UK this week ${t.uk.recent} (${t.uk.previous} before). US this week ${t.us.recent} (${t.us.previous} before).</p>
  ${(t.signals||[]).length?`<h3 class="dh">Also showing up elsewhere</h3><ul class="slist">${t.signals.map(s=>`<li>${esc(s.label)}</li>`).join("")}</ul>`:""}
  ${(t.topics||[]).length?`<h3 class="dh">Themes</h3><div class="tagrow">${t.topics.map(x=>`<button class="btn" data-topic="${esc(x)}">${esc(x)}</button>`).join("")}</div>`:""}
  ${grp("UK and US news",news)}${grp("Platform activity",plat)}
  <div class="tagrow" style="margin-top:26px"><button class="btn" data-act="copysum">Copy summary</button></div></div>`;
  $("scrim").hidden=false;d.hidden=false;d.scrollTop=0;document.body.style.overflow="hidden";
  $("main").inert=true;$("tabs").inert=true;document.querySelector(".mast").inert=true;$("dclose").focus()}
function closeDrawer(quiet){if($("drawer").hidden)return;$("drawer").hidden=true;$("scrim").hidden=true;document.body.style.overflow="";
  $("main").inert=false;$("tabs").inert=false;document.querySelector(".mast").inert=false;
  if(!quiet&&lastFocus&&document.contains(lastFocus))lastFocus.focus()}
document.addEventListener("keydown",e=>{const d=$("drawer");if(d.hidden)return;
  if(e.key==="Escape"){closeDrawer()}
  if(e.key==="Tab"){const f=[...d.querySelectorAll("button,a[href]")];if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
$("scrim").onclick=()=>closeDrawer();

/* actions */
document.addEventListener("click",async e=>{
  const row=e.target.closest("[data-t]");if(row){openT(+row.dataset.t,row,row.dataset.us==="1");return}
  const th=e.target.closest("[data-topic]");if(th){const same=topic===th.dataset.topic;topic=same?"":th.dataset.topic;const wasOpen=!$("drawer").hidden;closeDrawer(true);if(location.hash.startsWith("#s/")&&false){}refresh();if(wasOpen||!same)window.scrollTo(0,0);return}
  const rg=e.target.closest("[data-r]");if(rg){region=rg.dataset.r;try{localStorage.setItem("th_reg",region)}catch{}refresh();return}
  const j=e.target.closest("[data-jump]");if(j){const el=$(j.dataset.jump);if(el){el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});el.setAttribute("tabindex","-1");el.focus({preventScroll:true})}return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="close")closeDrawer();
  if(act==="cleartopic"){topic="";refresh()}
  if(act==="clearq"){q="";refresh()}
  if(act==="copy"){try{await navigator.clipboard.writeText(location.origin+location.pathname+"?sel="+encodeURIComponent(ser())+location.hash);a.textContent="Link copied"}catch{a.textContent="Copy failed"}}
  if(act==="copysum"&&openT_){const t=openT_,r=rs(t);const txt=[t.title,`${t.segment}, ${t.channel}`,`${life(r).t}: ${r.recent} mentions this week, ${r.previous} the week before`,t.summary||"",t.angle?"Angle: "+t.angle:"","For editors: "+guide(t,r),"Sources:",...t.items.map(i=>`- ${i.title} (${i.source}) ${i.link}`)].filter(Boolean).join("\n");
    try{await navigator.clipboard.writeText(txt);a.textContent="Summary copied"}catch{a.textContent="Copy failed"}}
});

fetch("data/trends.json").then(r=>r.json()).then(d=>{
  if(d.version!==2){$("updated").textContent="This data is from an older version.";$("tabs").hidden=true;$("main").innerHTML=`<div class="empty"><h2>Data needs refreshing</h2><p class="sub">Run the “Update trends” workflow in GitHub Actions, then reload this page.</p></div>`;return}
  data=d;const OK=[];for(let h=0;h<360;h+=9)if(h<45||h>125)OK.push(h);data.segments.forEach((s,i)=>HUE[s.name]=OK[(i*10)%OK.length]);
  $("updated").textContent="Updated "+new Date(d.updated).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  $("foot").innerHTML=`<p><button class="btn" data-act="copy">Copy a link to this view</button> The link carries your chosen sections.</p><p><b>About these numbers.</b> Activity counts news stories plus Wikipedia surges and YouTube chart entries. It shows relative interest, not search volume.</p><p>UK and US labels follow the publisher's country where it is known. Rising, steady and cooling compare the last 7 days with the 7 before.</p>`;
  addEventListener("hashchange",show);chosen=loadSel();show()}).catch(()=>{$("tabs").hidden=true;$("updated").textContent="";$("main").innerHTML=`<div class="empty"><h2>No data yet</h2><p class="sub">Run the “Update trends” workflow in GitHub Actions to generate it, then reload this page.</p></div>`});
</script></body></html>
