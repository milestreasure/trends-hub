<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magazine Trends Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--ink:#14213d;--mute:#5b6577;--card:#fff;--line:#dfe3ea;--up:#0a7d4f;--flat:#5b6577;--down:#b3402a;--hi:#14213d;--hit:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1524;--ink:#e8ecf5;--mute:#9aa5ba;--card:#18203a;--line:#2a3555;--up:#4fd09a;--flat:#9aa5ba;--down:#ff8f77;--hi:#e8ecf5;--hit:#0f1524}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font:700 clamp(2rem,6vw,3.4rem)/1.05 "Bricolage Grotesque",sans-serif;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tile{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.tile[aria-pressed=true]{background:var(--hi);color:var(--hit);border-color:var(--hi)}
.tile.small{padding:4px 11px;font-size:.88rem}
.view{margin-bottom:20px}.view .tile{border-radius:8px}
.tile:focus-visible,summary:focus-visible{outline:3px solid var(--up);outline-offset:2px}
.tile small{opacity:.7;margin-left:6px}
section{margin:28px 0 36px}h2{font:700 1.6rem "Bricolage Grotesque",sans-serif;margin:0 0 4px}
h3.chan{font:700 1.1rem "Bricolage Grotesque",sans-serif;margin:22px 0 10px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
article h4{font-size:1.02rem;line-height:1.3;margin:6px 0 8px}
.sig{font-weight:600;font-size:.9rem}.rising{color:var(--up)}.steady{color:var(--flat)}.fading{color:var(--down)}
.meta{color:var(--mute);font-size:.88rem}.angle{margin:8px 0 0;font-size:.92rem}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:.8rem;color:var(--mute);margin:6px 6px 0 0}
details{margin-top:10px}summary{cursor:pointer;color:var(--mute);font-size:.9rem}
li{margin:6px 0;font-size:.9rem}a{color:inherit}
</style></head><body><main>
<h1>Magazine Trends Hub</h1>
<p class="sub" id="updated">Loading latest trends…</p>
<div class="tiles view" id="view" role="group" aria-label="View"></div>
<div class="tiles" id="tiles" role="group" aria-label="Filter"></div>
<div class="tiles" id="chans" role="group" aria-label="Sub-category filter"></div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data,mode="segment",active="All",chan="All";
fetch("data/trends.json").then(r=>r.json()).then(d=>{data=d;
  if(!d.segments.every(s=>Array.isArray(s.channels))){$("updated").textContent="This data is from an older version. Run the “Update trends” workflow again to refresh it.";return}
  $("updated").textContent="Updated "+new Date(d.updated).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})+". Rising or fading compares the last 7 days with the 7 before.";
  draw()}).catch(()=>{$("updated").textContent="No data yet. Run the “Update trends” workflow in GitHub Actions to generate it."});
const btn=(n,label,count,on,cls="")=>`<button class="tile ${cls}" aria-pressed="${on}" data-n="${esc(n)}">${esc(label)}${count!=null?`<small>${count}</small>`:""}</button>`;
const card=(t,where)=>`<article><span class="sig ${t.signal}">${{rising:"Rising ▲",steady:"Steady ●",fading:"Fading ▼"}[t.signal]}</span>
  <h4>${esc(t.title)}</h4>${t.summary?`<p>${esc(t.summary)}</p>`:""}${t.angle?`<p class="angle"><b>Angle:</b> ${esc(t.angle)}</p>`:""}
  <div class="meta">${t.recent} stories this week (${t.previous} before) from ${t.sources} sources</div>
  ${(t.signals||[]).map(s=>`<div class="meta">${esc(s.label)}</div>`).join("")}${where?`<div class="meta">In ${esc(t.segment)}, ${esc(t.channel)}</div>`:""}${(where?[]:t.topics||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}
  <details><summary>Sources</summary><ul>${t.items.map(i=>`<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a> <span class="meta">${esc(i.source)}</span></li>`).join("")}</ul></details></article>`;
function draw(){
  $("view").innerHTML=btn("segment","By segment",null,mode==="segment")+btn("topic","By topic",null,mode==="topic");
  $("view").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{mode=b.dataset.n;active="All";chan="All";draw()});
  const bind=(el,fn)=>$(el).querySelectorAll(".tile").forEach(b=>b.onclick=()=>{fn(b.dataset.n);draw()});
  $("chans").innerHTML="";
  if(mode==="topic"){
    const ts=data.topics||[];
    $("tiles").innerHTML=btn("All","All topics",ts.length,active==="All")+ts.map(t=>btn(t.name,t.name,t.total,active===t.name)).join("");
    bind("tiles",n=>active=n);
    $("out").innerHTML=ts.filter(t=>active==="All"||t.name===active).map(t=>`<section><h2>${esc(t.name)}</h2><p class="meta">${t.total} trends across segments</p><div class="grid">${t.trends.map(x=>card(x,true)).join("")}</div></section>`).join("")||"<p>No topics matched yet.</p>";
    return}
  const segs=data.segments.filter(s=>s.channels.length),cnt=s=>s.channels.reduce((a,c)=>a+c.trends.length,0);
  $("tiles").innerHTML=btn("All","All segments",segs.reduce((a,s)=>a+cnt(s),0),active==="All")+segs.map(s=>btn(s.name,s.name,cnt(s),active===s.name)).join("");
  bind("tiles",n=>{active=n;chan="All"});
  const cur=segs.find(s=>s.name===active);
  if(cur&&cur.channels.length>1){$("chans").innerHTML=btn("All","All sub-categories",null,chan==="All","small")+cur.channels.map(c=>btn(c.name,c.name,c.trends.length,chan===c.name,"small")).join("");bind("chans",n=>chan=n)}
  $("out").innerHTML=segs.filter(s=>active==="All"||s.name===active).map(s=>`<section><h2>${esc(s.name)}</h2>`+
    s.channels.filter(c=>chan==="All"||c.name===chan).map(c=>`<h3 class="chan">${esc(c.name)}</h3><div class="grid">${c.trends.map(x=>card(x,false)).join("")}</div>`).join("")+`</section>`).join("")||"<p>No trends found yet.</p>";
}
</script></body></html>
